name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"     # weekly: catch library drift and dead DOIs

permissions:
  contents: read

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: python -m pytest -q --cov=seqreport --cov-report=term-missing
      - run: python -m pytest -q --doctest-modules src/seqreport

  notebooks:
    name: execute every notebook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # nbconvert executes the notebook but cannot start a kernel by itself: ipykernel
      # (in the dev extra) provides the "python3" kernelspec. Without it this job fails
      # with "NoSuchKernel: No such kernel named python3".
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" nbconvert
      - name: Execute from the repository root
        run: |
          for nb in notebooks/*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute --stdout "$nb" > /dev/null
            echo "::endgroup::"
          done
      - name: Execute from elsewhere (notebooks must not assume a working directory)
        run: |
          cd /tmp
          for nb in "$GITHUB_WORKSPACE"/notebooks/*.ipynb; do
            jupyter nbconvert --to notebook --execute --stdout "$nb" > /dev/null
          done

  figures:
    name: figures reproduce from data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Regenerate and compare
        run: |
          python scripts/make_figures.py
          git diff --quiet figures/ || (echo "::error::figures drifted from data"; git diff --stat figures/; exit 1)
      - name: Determinism across hash seeds
        run: |
          for seed in 1 2 3; do
            PYTHONHASHSEED=$seed python scripts/make_figures.py > /dev/null
            md5sum figures/*.png | md5sum
          done | sort -u > /tmp/hashes
          if [ "$(wc -l < /tmp/hashes)" -ne 1 ]; then
            echo "::error::figures are not deterministic across PYTHONHASHSEED"; cat /tmp/hashes; exit 1
          fi

  data-and-links:
    name: data metadata, links, citation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" cffconvert
      - run: python scripts/check_data_metadata.py
      - run: python scripts/fetch_datasets.py
      - run: python scripts/check_docs_links.py
      - name: Citation file is valid
        run: cffconvert --validate
      - name: Does the QC dataset still contain exactly its documented defects?
        run: python -m pytest -q tests/test_datasets.py

  references:
    name: DOIs resolve and match their titles
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_references.py

  cross-validation:
    name: cross-validate against Biopython
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e . biopython
      - run: python scripts/validate_against_biopython.py

  docs:
    name: docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install mkdocs-material pymdown-extensions
      - run: NO_MKDOCS_2_WARNING=1 mkdocs build --strict
