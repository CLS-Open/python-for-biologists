[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seqreport"
version = "0.1.0"
description = "Quality control and composition reporting for FASTA files — a teaching package for Python Foundations for the Life Sciences (CLS-Open #1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ademola Emmanuel Tolulope" }]
keywords = ["bioinformatics", "education", "fasta", "quality-control", "python"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "matplotlib>=3.8", "pyyaml>=6", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6.29"]
validation = ["biopython>=1.83"]

[project.scripts]
seqreport = "seqreport.cli:main"

[project.urls]
Homepage = "https://github.com/cls-open/python-for-biologists"
Documentation = "https://cls-open.github.io/python-for-biologists/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
